<svg xmlns="http://www.w3.org/2000/svg" width="440" height="170" viewBox="0 0 440 170">
  <text x="20" y="26" fill="#62a8f5" font-family="Arial, sans-serif" font-size="15" font-weight="bold">2 columns per strip</text>

  <!-- One tile split into three vertical strips, each two columns wide. -->
  <g shape-rendering="crispEdges">
    <rect x="20" y="40" width="100" height="90" fill="#344f6a"/>
    <rect x="120" y="40" width="100" height="90" fill="#36594f"/>
    <rect x="220" y="40" width="100" height="90" fill="#5d5132"/>
    <path d="M45 40V130 M70 40V130 M95 40V130 M145 40V130 M170 40V130 M195 40V130 M245 40V130 M270 40V130 M295 40V130 M20 55H320 M20 70H320 M20 85H320 M20 100H320 M20 115H320" fill="none" stroke="#aab5c2" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M120 40V130 M220 40V130" fill="none" stroke="#c4cbd4" stroke-width="2"/>
    <rect x="20.75" y="40.75" width="298.5" height="88.5" fill="none" stroke="#c4cbd4" stroke-width="1.5"/>
  </g>

  <text x="20" y="154" fill="#c4cbd4" font-family="Arial, sans-serif" font-size="12">Each strip spans the tile’s full height.</text>
</svg>
