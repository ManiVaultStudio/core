<svg xmlns="http://www.w3.org/2000/svg" width="440" height="170" viewBox="0 0 440 170">
  <text x="20" y="26" fill="#62a8f5" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Tiles grouped into supertiles</text>

  <!-- A 4 by 4 tile layout, grouped into four 2 by 2 supertiles. -->
  <g shape-rendering="crispEdges">
    <rect x="20" y="40" width="100" height="48" fill="#344f6a"/>
    <rect x="120" y="40" width="100" height="48" fill="#36594f"/>
    <rect x="20" y="88" width="100" height="48" fill="#5d5132"/>
    <rect x="120" y="88" width="100" height="48" fill="#493f59"/>
    <path d="M70 40V136 M170 40V136 M20 64H220 M20 112H220" fill="none" stroke="#aab5c2" stroke-opacity="0.65" stroke-width="1"/>
    <path d="M120 40V136 M20 88H220" fill="none" stroke="#c4cbd4" stroke-width="2"/>
    <rect x="20.75" y="40.75" width="198.5" height="94.5" fill="none" stroke="#c4cbd4" stroke-width="1.5"/>
  </g>

  <text x="20" y="158" fill="#c4cbd4" font-family="Arial, sans-serif" font-size="12">Each color marks a 2 × 2 group of tiles stored together.</text>
</svg>
